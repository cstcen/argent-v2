[project]
name = "argent"
version = "0.3.2"
description = "Argent — 问述科技桌面 AI 助手 TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.scripts]
argent = "argent_tui.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"